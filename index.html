<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <title>B2H — Η νέα σειρά είναι εδώ</title>
  <meta name="description" content="Γνωρίστε τη νέα σειρά B2H μέσα από μια δυναμική εμπειρία κύλισης.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="homepage.css?v=20260808-mobile2">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <noscript>Η διαδραστική παρουσίαση χρειάζεται JavaScript.</noscript>

  <main id="showcase" class="showcase" aria-label="Νέα σειρά προϊόντων B2H">
    <section class="stage" aria-live="polite">
      <div id="backgrounds" class="backgrounds" aria-hidden="true"></div>
      <div id="effects" class="effects" aria-hidden="true"></div>

      <div id="product-halo" class="product-halo" aria-hidden="true"></div>
      <div id="product-shadow" class="product-shadow" aria-hidden="true"></div>
      <canvas id="product-canvas" aria-hidden="true"></canvas>

      <header class="topbar">
        <a class="brand" href="https://b2h.gr/" aria-label="B2H αρχική">
          <img src="home-assets/b2h-logo.png" alt="B2H">
        </a>
        <div class="launch-pill"><span></span> Η ΝΕΑ ΣΕΙΡΑ ΕΙΝΑΙ ΕΔΩ</div>
        <div class="counter"><span id="counter-current">01</span><i></i><span id="counter-total">11</span></div>
      </header>

      <div id="copy" class="copy">
        <p id="eyebrow" class="eyebrow">ΝΕΑ ΕΠΟΧΗ · B2H</p>
        <h1 id="title">Η ΥΓΕΙΑ ΣΑΣ,<br>ΣΕ ΚΙΝΗΣΗ.</h1>
        <p id="description" class="description">Δέκα στοχευμένες φόρμουλες. Ένα νέο σύστημα καθημερινής υποστήριξης.</p>
        <a id="cta" class="cta" href="#products"><span>ΓΝΩΡΙΣΤΕ ΤΗ ΝΕΑ ΣΕΙΡΑ</span><b aria-hidden="true">↗</b></a>
      </div>

      <div class="product-caption" aria-hidden="true">
        <span id="caption-name">OMEGA-3</span>
        <span id="caption-series">CLINICAL SERIES</span>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <span>SCROLL TO REVEAL</span>
        <i><b id="scroll-progress"></b></i>
      </div>

      <div class="grain" aria-hidden="true"></div>
    </section>
  </main>

  <section id="products" class="after-showcase">
    <p>Η ΝΕΑ ΣΕΙΡΑ B2H</p>
    <h2>Σχεδιασμένη για την πραγματική καθημερινότητα.</h2>
    <a href="https://b2h.gr/">ΕΠΙΣΚΕΦΘΕΙΤΕ ΤΟ B2H.GR <span>↗</span></a>
  </section>

  <script type="module" src="homepage.js?v=20260808-mobile2"></script>
</body>
</html>
