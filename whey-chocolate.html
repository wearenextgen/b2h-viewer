<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2H Whey Protein Chocolate 2kg Viewer</title>
  <style>
    html,body,#wrap{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 22%,#fff 0,#f5efeb 56%,#e4d8d2 100%);font-family:Arial,sans-serif}canvas{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f8f3ef;z-index:2;transition:opacity .3s}.loading.is-hidden{opacity:0;pointer-events:none}.card{width:min(68vw,260px);text-align:center;color:#9b5758;font-size:11px;letter-spacing:.2em;text-transform:uppercase}.bar{height:5px;background:#eadcda;border-radius:9px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:#ad6264}.hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7e4e4f;background:#ffffffb8;padding:8px 13px;border-radius:20px;z-index:1}
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body data-label="./whey-chocolate-label.png">
  <div id="wrap"><div class="loading" id="loading"><div class="card">Loading Chocolate 2kg<div class="bar"><div class="fill" id="loading-fill"></div></div></div></div><div class="hint">drag to rotate · scroll to zoom</div></div>
  <script type="module" src="./whey-viewer.js"></script>
</body>
</html>
